[build]
  # Clean dist so Netlify never publishes a stale bundle from cache
  command = "rm -rf dist && npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"
[context.production]
  command = "rm -rf dist && npm run build"
  publish = "dist"

[context.deploy-preview]
  command = "rm -rf dist && npm run build"
  publish = "dist"

# SPA fallback: public/_redirects → /* /index.html 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/boot.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/theme-init.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/deploy-sync.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
